apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base

namespace: example
namePrefix: example-

secretGenerator:
  - name: mariadb-secret
    behavior: replace
    literals:
      - MARIADB_ROOT_PASSWORD=example-password

images:
  - name: mariadb
    newTag: "11.4"

patches:
  - path: mariadb-storage-patch.yaml
