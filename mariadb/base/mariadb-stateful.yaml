#apiVersion: v1
#kind: Secret
#metadata:
#  name: mariadb-secret
#type: Opaque
#stringData:
#  MARIADB_ROOT_PASSWORD: {{ .MARIADB_ROOT_PASSWORD }}
#  MARIADB_USER: {{ .MARIADB_USER }}
#  MARIADB_PASSWORD: {{ .MARIADB_PASSWORD }}
#  MARIADB_DATABASE: {{ .MARIADB_DATABASE }}

---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    app: mariadb
spec:
  ports:
    - port: 3306
      name: mariadb
  clusterIP: None   # headless service for StatefulSet
  selector:
    app: mariadb

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  serviceName: "mariadb"
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mariadb
          envFrom:
            - secretRef:
                name: mariadb-secret
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # change storageClassName / resources.requests/storage as needed:
        resources:
          requests:
            storage: 10Gi
